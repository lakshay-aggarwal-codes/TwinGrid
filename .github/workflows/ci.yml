name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # runs the `bootstrap` job (hash-pinned lock, base-image digest) in addition to the gate

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12.10" # matches runtime.txt
  PYTHONHASHSEED: "0"
  # Test-only secret -- never the real deployment secret. api/auth.py refuses to import without it.
  JWT_SECRET_KEY: ci-test-secret-not-for-production
  ENVIRONMENT: development
  # CPU-only torch wheels (stable-baselines3 pulls torch; the default Linux wheel bundles CUDA).
  TORCH_CPU_INDEX: https://download.pytorch.org/whl/cpu
  # Type-error ceiling (T11 / Task 7). MEASURED, not guessed: 881 errors with pyrefly 0.64.1 (pinned in
  # requirements-dev.txt), on the owner's Windows .venv, twice with identical results; see reports/postT9/T11_ci_run.md.
  # RATCHET RULE: this number may only go DOWN. Lower it whenever the `types` job prints a notice that errors fell.
  # The one permitted upward edit is the FIRST green-field Linux run, if it prints a higher count than the Windows
  # measurement (different installed packages); record that count and its run URL in T11_ci_run.md. After that, never up.
  # Changing the pinned pyrefly version re-baselines the count and must be recorded the same way.
  PYREFLY_ERROR_CEILING: "1120"

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install ruff (version pinned in requirements-dev.txt)
        run: pip install "$(grep -E '^ruff==' requirements-dev.txt)"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: Job summary (runtime versions)
        if: always()
        run: |
          {
            echo "### lint"
            echo "- python $(python --version 2>&1 | cut -d' ' -f2) (pinned: ${PYTHON_VERSION})"
            echo "- $(ruff --version)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: External-data register (T22)
        # stdlib only. Fails on unregistered datasets, missing used_by paths, claim verbs without a code path,
        # unverified licences marked redistributable, and references to datasets that must stay out of the repo.
        run: python scripts/check_register.py

  types:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt

      - name: Install runtime lock (hash-checked) so imports resolve
        run: pip install --require-hashes --extra-index-url "$TORCH_CPU_INDEX" -r requirements.lock

      - name: Install pyrefly
        run: pip install "$(grep -E '^pyrefly' requirements-dev.txt)"

      - name: pyrefly check (error count ratchet)
        run: |
          pyrefly check --output-format=json > pyrefly.json || true
          python - <<'PY'
          import json, os, sys

          data = json.load(open("pyrefly.json", encoding="utf-8"))
          errors = data.get("errors", []) if isinstance(data, dict) else data
          count = len(errors)
          ceiling = os.environ["PYREFLY_ERROR_CEILING"]
          print(f"pyrefly errors: {count} (ceiling: {ceiling})")
          import subprocess

          version = subprocess.run(["pyrefly", "--version"], capture_output=True, text=True).stdout.strip()
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write(f"### types\n- python {sys.version.split()[0]}\n- {version}\n- errors: {count}, ceiling: {ceiling}\n")
          if ceiling == "unset":
              sys.exit(f"No baseline recorded. Set PYREFLY_ERROR_CEILING to {count} in ci.yml and record it in reports/postT9/T11_ci_run.md.")
          if count > int(ceiling):
              sys.exit(f"Type errors went UP: {count} > ceiling {ceiling}. Fix them; the ceiling may only shrink.")
          if count < int(ceiling):
              print(f"::notice::Type errors fell to {count}; lower PYREFLY_ERROR_CEILING from {ceiling} to {count}.")
          PY

      - name: Upload pyrefly report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyrefly-report
          path: pyrefly.json
          if-no-files-found: ignore

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tests/test_baselines.py runs `git merge-base --is-ancestor`

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt

      - name: Install runtime lock (hash-checked), then dev tools
        run: |
          pip install --require-hashes --extra-index-url "$TORCH_CPU_INDEX" -r requirements.lock
          pip install --extra-index-url "$TORCH_CPU_INDEX" -r requirements-dev.txt

      - name: Install locust (tests/test_load_harness.py skips without it, and this job allows no skips)
        # TEMPORARY: belongs in requirements-dev.txt (Task 21 "Requested cross-task change"). Delete this step when it is there.
        run: pip install "locust>=2.20,<3"

      # tests/test_ig05_rack_id_parity.py and tests/test_facility_seed.py run the frontend .ts fixtures with node and
      # skip when node is missing. Pin the same Node as the frontend job so they run, identically, every time.
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"

      - name: API reference is in sync (docs/api/)
        # Named failure instead of burying it in the full run (tests/test_task9_api_reference.py is the in-suite twin).
        run: python scripts/gen_api_reference.py --check

      - name: TensorFlow and stable-baselines3 must be importable
        run: python -c "import tensorflow, stable_baselines3, torch; print(tensorflow.__version__, stable_baselines3.__version__, torch.__version__)"

      - name: Audit regression gate (physics executed, hard constraints, parity)
        # Runs first and on its own so a regression in the audited behaviour is named in the job, not buried in the full run.
        run: pytest tests/test_audit_regressions.py -q -rs

      - name: pytest (everything except the PostgreSQL tests)
        run: >
          pytest tests -m "not postgres" -rs
          --cov=src --cov=api --cov-report=term-missing
          --junitxml=junit.xml

      - name: Fail if any test was skipped
        # xfail is reported as <skipped type="pytest.xfail"> in JUnit XML; the strict characterization xfails are
        # intentional, so only real skips (skipif / importorskip / skip) count.
        run: |
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          skipped = []
          for case in ET.parse("junit.xml").getroot().iter("testcase"):
              for node in case.findall("skipped"):
                  if node.get("type") != "pytest.xfail":
                      skipped.append(f"{case.get('classname')}::{case.get('name')} -- {node.get('message')}")
          if skipped:
              print("\n".join(skipped))
              sys.exit(f"{len(skipped)} test(s) skipped; the CI gate allows none.")
          print("no skipped tests")
          PY

      - name: Job summary (runtime versions and test counts)
        if: always()
        run: |
          python - <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET
          from importlib import metadata

          def version(name):
              try:
                  return metadata.version(name)
              except metadata.PackageNotFoundError:
                  return "not installed"

          lines = ["### test", f"- python {sys.version.split()[0]}, node {os.popen('node --version').read().strip()}"]
          lines.append("- " + ", ".join(f"{n} {version(n)}" for n in ("pytest", "tensorflow", "torch", "stable-baselines3", "numpy")))
          try:
              total = failed = errored = skipped = xfailed = 0
              for case in ET.parse("junit.xml").getroot().iter("testcase"):
                  total += 1
                  failed += case.find("failure") is not None
                  errored += case.find("error") is not None
                  node = case.find("skipped")
                  if node is not None:
                      if node.get("type") == "pytest.xfail":
                          xfailed += 1
                      else:
                          skipped += 1
              passed = total - failed - errored - skipped - xfailed
              lines.append(f"- tests: {total} collected, {passed} passed, {failed} failed, {errored} errors, {skipped} skipped, {xfailed} xfail")
          except (OSError, ET.ParseError) as exc:
              lines.append(f"- junit.xml not readable: {exc}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("\n".join(lines) + "\n")
          PY

      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit
          path: junit.xml

  test-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: twingrid_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # postgresql:// is rewritten to asyncpg by db_url.normalize_database_url (alembic) and used as-is
      # (psycopg2) by tests/test_provenance_m1.py.
      TWINGRID_TEST_PG_URL: postgresql://postgres:postgres@localhost:5432/twingrid_ci
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/twingrid_ci
      # Async (asyncpg) URL for the tests that call create_async_engine directly:
      # tests/test_audit_migration.py reads TEST_POSTGRES_URL, tests/test_telemetry_ingest.py TWINGRID_TEST_PG_ASYNC_URL.
      TEST_POSTGRES_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/twingrid_ci
      TWINGRID_TEST_PG_ASYNC_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/twingrid_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt

      - name: Install runtime lock (hash-checked), then dev tools
        run: |
          pip install --require-hashes --extra-index-url "$TORCH_CPU_INDEX" -r requirements.lock
          pip install --extra-index-url "$TORCH_CPU_INDEX" -r requirements-dev.txt

      - name: alembic upgrade head / check (ORM == migrations)
        run: |
          alembic heads
          alembic upgrade head
          alembic check

      - name: alembic downgrade base (leave the database clean)
        run: alembic downgrade base

      - name: Chain test + PostgreSQL-marked tests (none may be skipped)
        run: |
          pytest tests/test_alembic_chain.py -rs --junitxml=junit-pg-chain.xml
          # `-k "not sqlite"`: PG-only tests in test_telemetry_ingest.py are parametrised over sqlite and pg and
          # skip the sqlite variant by design; the sqlite variants run in the `test` job.
          pytest tests -m postgres -k "not sqlite" -rs --junitxml=junit-pg.xml
          python - <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET

          total = 0
          for path in ("junit-pg-chain.xml", "junit-pg.xml"):
              for case in ET.parse(path).getroot().iter("testcase"):
                  total += 1
                  if case.find("skipped") is not None:
                      sys.exit(f"skipped: {case.get('classname')}::{case.get('name')}")
          print(f"{total} PostgreSQL-side tests ran, none skipped")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write(f"### test-postgres\n- postgres:16 service, {total} PostgreSQL-side tests ran, none skipped\n")
          PY

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pip-audit
        run: pip install "$(grep -E '^pip-audit' requirements-dev.txt)"

      - name: pip-audit on the lock (two recorded waivers, see docs/security/waivers.md)
        # Fails on any known vulnerability. The two --ignore-vuln ids are recorded with reason, owner and expiry
        # in docs/security/waivers.md and reports/postT9/T11_ci_run.md; add no others without recording them.
        run: |
          pip-audit --version >> "$GITHUB_STEP_SUMMARY"
          pip-audit --requirement requirements.lock --require-hashes --disable-pip --strict \
            --ignore-vuln PYSEC-2026-1325 --ignore-vuln PYSEC-2026-4298

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: twin-stream-insight-main
    env:
      # Placeholder, NON-secret values so the production env guard in
      # vite.config.ts passes. The CI bundle is never deployed.
      VITE_API_BASE_URL: https://api.ci.invalid
      VITE_DEMO_USERNAME: ci_viewer
      VITE_DEMO_PASSWORD: ci-placeholder-not-a-real-password
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node (Vite 7 needs >= 20.19 / 22.12)
        uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: "npm"
          cache-dependency-path: twin-stream-insight-main/package-lock.json

      - name: Install (exact lockfile)
        run: npm ci

      - name: Job summary (runtime versions)
        run: |
          {
            echo "### frontend"
            echo "- node $(node --version), npm $(npm --version)"
            echo '- '"$(npm ls --depth=0 vite vitest typescript eslint 2>/dev/null | tr '\n' ' ')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Type check
        run: npm run typecheck

      - name: Lint (0 errors; warning count ratcheted by --max-warnings)
        run: npm run lint:ci

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Dependency audit (fails on any high/critical advisory not waived in docs/frontend/waivers/npm_audit.md)
        # npm audit has no ignore list; the gate script holds the waived GHSA ids and their expiry dates.
        run: node scripts/npm-audit-gate.mjs

  frontend-e2e:
    # FE-11: browser E2E against the REAL backend (compose: Postgres + Redis + API) with seeded viewer/operator accounts,
    # signing in through the real login screen. No request is stubbed (e2e/** is grep-gated). Still advisory
    # (`continue-on-error`) ONLY because the stack has not yet been recorded green in CI: after one recorded green run,
    # delete the `continue-on-error` line below and this comment. If the backend cannot start here, keep it advisory,
    # document the blocker, and do NOT substitute stubbed data.
    # ADVISORY OWNER: Lakshay. EXPIRY: 2026-11-30 (Task 21 default). By then either record one green run in
    # reports/postT9/T11_ci_run.md and delete `continue-on-error`, or write the blocker there and renew this date.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    env:
      # Test-only values, none of them secret. POSTGRES/REDIS passwords must be URL-safe (compose embeds them in URLs).
      POSTGRES_PASSWORD: ci_pg_password_not_secret
      REDIS_PASSWORD: ci_redis_password_not_secret
      ENVIRONMENT: development
      ALLOW_PUBLIC_REGISTRATION: "true"
      OPERATOR_REGISTRATION_KEY: ci-operator-registration-key-not-secret
      CORS_ALLOWED_ORIGINS: http://localhost:8080
      E2E_VIEWER_USERNAME: e2e_viewer
      E2E_VIEWER_PASSWORD: ci-e2e-viewer-password-1
      E2E_OPERATOR_USERNAME: e2e_operator
      E2E_OPERATOR_PASSWORD: ci-e2e-operator-password-1
    steps:
      - uses: actions/checkout@v4

      - name: Start the backend stack (compose services db, redis, backend)
        # `docker compose` interpolates EVERY service in the file, including the opt-in mqtt-ingest (profile `mqtt`), whose
        # MQTT_BROKER is required (`:?`). That service is not started here; the value only has to be non-empty.
        env:
          MQTT_BROKER: mqtt-profile-not-started
        run: docker compose up -d --build db redis backend

      - name: Wait for /healthz
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8000/healthz; then echo; echo "healthz OK after ~$((i * 3))s"; exit 0; fi
            sleep 3
          done
          echo "::error::backend did not become healthy"
          docker compose logs backend
          exit 1

      - name: Seed the viewer and operator accounts (POST /auth/register)
        run: |
          curl -fsS -X POST http://localhost:8000/auth/register -H 'Content-Type: application/json' \
            -d "{\"username\":\"$E2E_VIEWER_USERNAME\",\"password\":\"$E2E_VIEWER_PASSWORD\",\"role\":\"viewer\"}"
          echo
          curl -fsS -X POST http://localhost:8000/auth/register -H 'Content-Type: application/json' \
            -H "X-Admin-Key: $OPERATOR_REGISTRATION_KEY" \
            -d "{\"username\":\"$E2E_OPERATOR_USERNAME\",\"password\":\"$E2E_OPERATOR_PASSWORD\",\"role\":\"operator\"}"
          echo

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: "npm"
          cache-dependency-path: twin-stream-insight-main/package-lock.json

      - name: Install (exact lockfile)
        working-directory: twin-stream-insight-main
        run: npm ci

      - name: Install Chromium
        working-directory: twin-stream-insight-main
        run: npx playwright install --with-deps chromium

      - name: E2E against the real backend
        working-directory: twin-stream-insight-main
        env:
          # The dev server talks to the compose backend. VITE_DEMO_* is deliberately NOT set: the specs must see
          # the real sign-in screen.
          VITE_API_BASE_URL: http://localhost:8000
        # One worker: the backend limits sign-ins to 10/minute per IP.
        run: npm run test:e2e -- --workers=1

      - name: Upload Playwright report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            twin-stream-insight-main/playwright-report/
            twin-stream-insight-main/test-results/
          if-no-files-found: ignore

      - name: Backend logs
        if: always()
        run: docker compose logs backend || true

      - name: Stop the stack
        if: always()
        run: docker compose down -v || true

  frontend-contract:
    # FE-11: contract-drift gate. Re-captures every endpoint from the compose backend, then (1) runs the fixture/schema
    # tests on the FRESH captures (any schema failure fails the job; record a contract finding, never loosen the schema),
    # (2) diffs fresh vs COMMITTED fixtures by shape and the OpenAPI typed-model property names, and (3) proves the gate
    # can fail by running the diff against a deliberately mutated copy. Advisory until recorded green once (same rule as
    # frontend-e2e); it also fails while no real fixtures are committed: capture them from the uploaded artifact.
    # ADVISORY OWNER: Lakshay. EXPIRY: 2026-11-30 (Task 21 default). Same exit rule as frontend-e2e, plus: commit the
    # real fixtures (twin-stream-insight-main/src/contract/fixtures/) first; without them this job cannot go green.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    env:
      POSTGRES_PASSWORD: ci_pg_password_not_secret
      REDIS_PASSWORD: ci_redis_password_not_secret
      ENVIRONMENT: development
      ALLOW_PUBLIC_REGISTRATION: "true"
      OPERATOR_REGISTRATION_KEY: ci-operator-registration-key-not-secret
      CORS_ALLOWED_ORIGINS: http://localhost:8080
      E2E_OPERATOR_USERNAME: e2e_operator
      E2E_OPERATOR_PASSWORD: ci-e2e-operator-password-1
    steps:
      - uses: actions/checkout@v4

      - name: Start the backend stack (compose services db, redis, backend)
        # `docker compose` interpolates EVERY service in the file, including the opt-in mqtt-ingest (profile `mqtt`), whose
        # MQTT_BROKER is required (`:?`). That service is not started here; the value only has to be non-empty.
        env:
          MQTT_BROKER: mqtt-profile-not-started
        run: docker compose up -d --build db redis backend

      - name: Wait for /healthz
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8000/healthz; then echo; echo "healthz OK after ~$((i * 3))s"; exit 0; fi
            sleep 3
          done
          echo "::error::backend did not become healthy"
          docker compose logs backend
          exit 1

      - name: Seed the operator account (an operator also captures POST /api/optimize)
        run: |
          curl -fsS -X POST http://localhost:8000/auth/register -H 'Content-Type: application/json' \
            -H "X-Admin-Key: $OPERATOR_REGISTRATION_KEY" \
            -d "{\"username\":\"$E2E_OPERATOR_USERNAME\",\"password\":\"$E2E_OPERATOR_PASSWORD\",\"role\":\"operator\"}"
          echo

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: "npm"
          cache-dependency-path: twin-stream-insight-main/package-lock.json

      - name: Install (exact lockfile)
        working-directory: twin-stream-insight-main
        run: npm ci

      - name: Keep a copy of the committed fixtures
        working-directory: twin-stream-insight-main
        run: |
          mkdir -p /tmp/committed-fixtures
          cp -R src/contract/fixtures/. /tmp/committed-fixtures/

      - name: Re-capture from the compose backend (overwrites the workspace copy only)
        working-directory: twin-stream-insight-main
        env:
          TWINGRID_API_BASE_URL: http://localhost:8000
          TWINGRID_USERNAME: ${{ env.E2E_OPERATOR_USERNAME }}
          TWINGRID_PASSWORD: ${{ env.E2E_OPERATOR_PASSWORD }}
          TWINGRID_BACKEND_HASH: ${{ github.sha }}
          CAPTURE_LIVE_FRAMES: "3"
        run: node scripts/capture-contract.mjs

      - name: Schema check on the fresh captures (fixtures + OpenAPI typed models)
        working-directory: twin-stream-insight-main
        run: npx vitest run src/contract

      - name: Drift check - fresh vs committed
        working-directory: twin-stream-insight-main
        run: node scripts/capture-contract.mjs --diff /tmp/committed-fixtures src/contract/fixtures

      - name: Negative check - the drift gate must fail on a mutated fixture
        working-directory: twin-stream-insight-main
        run: |
          rm -rf /tmp/mutated-fixtures && cp -R src/contract/fixtures /tmp/mutated-fixtures
          node -e '
            const fs = require("fs");
            const p = "/tmp/mutated-fixtures/state.json";
            const j = JSON.parse(fs.readFileSync(p, "utf8"));
            delete j.body.pue;
            fs.writeFileSync(p, JSON.stringify(j));
          '
          if node scripts/capture-contract.mjs --diff /tmp/committed-fixtures /tmp/mutated-fixtures; then
            echo "::error::the drift gate did NOT fail on a mutated fixture"
            exit 1
          fi
          echo "drift gate correctly failed on the mutated fixture"

      - name: Upload the fresh capture and capture log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-fixtures
          path: |
            twin-stream-insight-main/src/contract/fixtures/
            twin-stream-insight-main/docs/frontend/contracts/capture.log
          if-no-files-found: ignore

      - name: Backend logs
        if: always()
        run: docker compose logs backend || true

      - name: Stop the stack
        if: always()
        run: docker compose down -v || true

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Base image must be pinned by digest
        run: |
          grep -Eq '^ARG PYTHON_IMAGE=python:3\.12\.10-slim@sha256:[0-9a-f]{64}$' Dockerfile \
            || { echo "::error::Dockerfile base image is not digest-pinned (see the comment at the top of the Dockerfile)"; exit 1; }

      - name: Build
        run: docker build --build-arg GIT_SHA="$GITHUB_SHA" -t digital-twin-backend:ci .

      - name: Image runs as a non-root user and carries GIT_SHA
        run: |
          test "$(docker run --rm --entrypoint id digital-twin-backend:ci -u)" != "0"
          test "$(docker run --rm --entrypoint printenv digital-twin-backend:ci GIT_SHA)" = "$GITHUB_SHA"

      - name: Start the container with a database and curl /healthz
        run: |
          docker network create ci-net
          docker run -d --name pg --network ci-net \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=digital_twin \
            --health-cmd "pg_isready -U postgres" --health-interval 3s --health-retries 20 postgres:16
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' pg)" = "healthy" ] && break
            sleep 2
          done
          docker run -d --name app --network ci-net -p 8000:8000 \
            -e DATABASE_URL=postgresql://postgres:postgres@pg:5432/digital_twin \
            -e JWT_SECRET_KEY="$JWT_SECRET_KEY" -e ENVIRONMENT=development \
            digital-twin-backend:ci
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/healthz; then echo; echo "healthz OK after ~$((i * 3))s"; exit 0; fi
            [ "$(docker inspect -f '{{.State.Running}}' app)" = "true" ] || break
            sleep 3
          done
          echo "::error::container did not become healthy"
          docker logs app
          exit 1

      - name: Container logs
        if: always()
        run: docker logs app || true

      - name: Job summary (versions)
        if: always()
        run: |
          {
            echo "### docker"
            echo "- docker $(docker --version)"
            echo "- image size: $(docker image inspect digital-twin-backend:ci --format '{{.Size}}' 2>/dev/null || echo n/a) bytes"
          } >> "$GITHUB_STEP_SUMMARY"

  gate:
    # ONE status check for branch protection: require `gate` and every blocking job below is required with it. The two
    # advisory Docker-stack jobs (frontend-e2e, frontend-contract) are deliberately not listed; they join `needs` on the
    # day their `continue-on-error` is removed (Task 7 exit rule in reports/postT9/T11_ci_run.md).
    # `if: always()` so a failed, cancelled or skipped dependency fails this job instead of skipping it (a skipped
    # required check reads as green on GitHub).
    if: always()
    needs: [lint, types, test, test-postgres, audit, frontend, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every blocking job succeeded
        run: |
          echo "results: ${{ join(needs.*.result, ' ') }}"
          for r in ${{ join(needs.*.result, ' ') }}; do
            [ "$r" = "success" ] || { echo "::error::a blocking job did not succeed ($r)"; exit 1; }
          done

  bootstrap:
    # Manual (Run workflow). Produces what could not be generated offline: the hash-pinned lock, the base-image
    # digest, and the first pyrefly count (printed by the `types` job). Commit the artifact; nothing is auto-committed.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: pip-compile --generate-hashes
        run: |
          pip install "$(grep -E '^pip-tools' requirements-dev.txt)"
          pip-compile --generate-hashes --allow-unsafe --strip-extras \
            --extra-index-url "$TORCH_CPU_INDEX" --output-file=requirements.lock.new requirements.txt
          grep -c -- '--hash=' requirements.lock.new

      - name: Resolve the base-image digest
        run: |
          docker pull "python:${PYTHON_VERSION}-slim" > /dev/null
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "python:${PYTHON_VERSION}-slim")"
          {
            echo "### Dockerfile line"
            echo '```'
            echo "ARG PYTHON_IMAGE=python:${PYTHON_VERSION}-slim@${digest#*@}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: requirements.lock
          path: requirements.lock.new
