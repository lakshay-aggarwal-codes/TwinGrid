name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Test-only secret -- never the real deployment secret. Required because
  # api/auth.py refuses to import without JWT_SECRET_KEY set (Phase 12).
  JWT_SECRET_KEY: ci-test-secret-not-for-production

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (matches runtime.txt)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r tests/test_requirements.txt
          pip install ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: pytest tests/ -v --cov=src --cov=api --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: twin-stream-insight-main
    env:
      # Placeholder, NON-secret values so the production env guard in
      # vite.config.ts passes. The CI bundle is never deployed.
      VITE_API_BASE_URL: https://api.ci.invalid
      VITE_DEMO_USERNAME: ci_viewer
      VITE_DEMO_PASSWORD: ci-placeholder-not-a-real-password
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node (Vite 7 needs >= 20.19 / 22.12)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: twin-stream-insight-main/package-lock.json

      - name: Install (exact lockfile)
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint (0 errors; warning count ratcheted by --max-warnings)
        run: npm run lint:ci

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Dependency audit (fails on high/critical)
        run: npm audit --audit-level=high

  frontend-e2e:
    # Browser smoke tests (Stage 22). Non-blocking until it has been green on
    # GitHub at least once: it could not be run in the environment it was
    # written in. Remove `continue-on-error` once it passes.
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: twin-stream-insight-main
    env:
      VITE_API_BASE_URL: https://api.ci.invalid
      VITE_DEMO_USERNAME: ci_viewer
      VITE_DEMO_PASSWORD: ci-placeholder-not-a-real-password
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: twin-stream-insight-main/package-lock.json

      - name: Install (exact lockfile)
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: twin-stream-insight-main/playwright-report/

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image (build-only, no push)
        run: docker build -t digital-twin-backend:ci .
        # No registry push here: no container registry credentials exist
        # yet, and a push step with nowhere real to push would be dead
        # configuration. Add a push step (with a repository secret for
        # registry auth) once Phase 17 (deployment) actually needs it.
