name: Secret scan

# gitleaks over the full history (configured). Rules and the documented placeholder allowlist: .gitleaks.toml.
# For a repository owned by a GitHub ORGANIZATION the action also needs a GITLEAKS_LICENSE secret; a personal
# repository needs nothing beyond the automatic GITHUB_TOKEN.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
