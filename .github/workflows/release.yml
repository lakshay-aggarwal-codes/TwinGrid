name: Release

# Runs ONLY for a pushed tag vX.Y.Z (never for a pull request, branch push or schedule). Nothing is pushed anywhere
# else: the image goes to GHCR, the frontend bundle is attached to the GitHub Release. See docs/release/RELEASE_PROCESS.md.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22.20.0" # same as ci.yml

jobs:
  verify:
    # The tag must be a SemVer release, sit on main, have a CHANGELOG section, and its commit must have passed CI.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag is vX.Y.Z and has a CHANGELOG section
        id: v
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag '$TAG' is not vMAJOR.MINOR.PATCH"; exit 1
          fi
          version="${TAG#v}"
          if ! grep -Eq "^## \[${version}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${version}] - YYYY-MM-DD' section"; exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Tagged commit is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_SHA is not reachable from main"; exit 1; }

      - name: CI passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
                 --status success --json databaseId --jq 'length')"
          [ "$n" -ge 1 ] || { echo "::error::no successful CI run for $GITHUB_SHA"; exit 1; }

  image:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # keyless signing of the provenance attestation
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Image name (registry names must be lowercase)
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}-api" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and OCI labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=TwinGrid API
            org.opencontainers.image.description=Simulation-based data-centre digital twin API (simulated data only)

      - name: Build and push (provenance + SBOM)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Attest build provenance (GitHub attestation, pushed to the registry)
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  frontend:
    needs: verify
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: twin-stream-insight-main
    env:
      # Non-secret repository VARIABLE (Settings > Secrets and variables > Actions > Variables). Inlined into the bundle.
      VITE_API_BASE_URL: ${{ vars.RELEASE_VITE_API_BASE_URL }}
      VITE_ERROR_REPORT_URL: ${{ vars.RELEASE_VITE_ERROR_REPORT_URL }}
    steps:
      - uses: actions/checkout@v7

      - name: API base URL is configured
        run: test -n "$VITE_API_BASE_URL" || { echo "::error::repository variable RELEASE_VITE_API_BASE_URL is not set"; exit 1; }

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: twin-stream-insight-main/package-lock.json

      - run: npm ci

      - run: npm run build

      - name: Package dist/
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          tar -C dist -czf "../twingrid-frontend-${VERSION}.tar.gz" .
          cd ..
          sha256sum "twingrid-frontend-${VERSION}.tar.gz" > "twingrid-frontend-${VERSION}.tar.gz.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: |
            twingrid-frontend-*.tar.gz
            twingrid-frontend-*.tar.gz.sha256
          if-no-files-found: error

  github-release:
    needs: [verify, image, frontend]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release and attach the frontend bundle
    steps:
      - name: Image name (registry names must be lowercase)
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}-api" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          # Release notes = the CHANGELOG section for this version, plus where the image is.
          awk -v v="## [${VERSION}]" 'index($0, v)==1 {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          {
            echo
            echo "Image: \`${IMAGE_NAME}:${VERSION}\` (digest \`${DIGEST}\`)"
            echo "Simulated data only; see docs/release/RELEASE_PROCESS.md for deploy order and rollback."
          } >> notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag \
            twingrid-frontend-*.tar.gz twingrid-frontend-*.tar.gz.sha256
