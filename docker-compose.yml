services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      # Required, no default. Use a URL-safe value (letters/digits): it is embedded in DATABASE_URL below.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (in .env or the shell)}
      POSTGRES_DB: digital_twin
    volumes:
      - db_data:/var/lib/postgresql/data
    # Deliberately NOT published on a host port: only services on the compose network reach it.
    # To inspect it from the host, run with the `debug-db` profile (see below).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  debug-db:
    # Opt-in: `docker compose --profile debug-db up -d debug-db` forwards 127.0.0.1:5432 (loopback ONLY) to
    # the db service. Not started by default, so a plain `docker compose up` publishes no database port.
    image: alpine/socat:1.8.0.0
    profiles: ["debug-db"]
    command: ["TCP-LISTEN:5432,fork,reuseaddr", "TCP:db:5432"]
    ports:
      - "127.0.0.1:5432:5432"
    depends_on:
      db:
        condition: service_healthy

  redis:
    # Not published on a host port: only the backend and worker reach it, over
    # the compose network, and it requires a password. Use a URL-safe
    # REDIS_PASSWORD (letters/digits) since it is embedded in REDIS_URL.
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set (in .env or the shell)}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set (in .env or the shell)}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    # Runs POST /api/optimize/train_async jobs (src/task_jobs.py) via RQ --
    # see src/task_queue.py and ADR 002 in docs/adr/. Same image as
    # `backend`, different command: no uvicorn, just the RQ worker loop.
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # --serializer must match src/task_queue.py (JSON, so Redis never feeds the
    # worker pickles). NOT VERIFIED here: run a train_async job end-to-end.
    command:
      - rq
      - worker
      - twingrid
      - --url
      - redis://:${REDIS_PASSWORD}@redis:6379/0
      - --serializer
      - rq.serializers.JSONSerializer
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      OPTIMIZER_MODEL_PATH: /app/models/optimizer
      ARTIFACT_VERIFY: ${ARTIFACT_VERIFY:-enforce}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./models:/app/models

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set (in .env or the shell)}
      OPERATOR_REGISTRATION_KEY: ${OPERATOR_REGISTRATION_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      # Safe by default: production unless explicitly overridden. In production the app refuses to start
      # without a strong METRICS_TOKEN (see api/startup_checks.py); for local dev set ENVIRONMENT=development.
      ENVIRONMENT: ${ENVIRONMENT:-production}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (in .env or the shell)}@db:5432/digital_twin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ARTIFACT_VERIFY: ${ARTIFACT_VERIFY:-enforce}
      # T17 telemetry. Rollback: TELEMETRY_STORE_ENABLED=false and TELEMETRY_WINDOW_SOURCE=memory.
      TELEMETRY_STORE_ENABLED: ${TELEMETRY_STORE_ENABLED:-true}
      TELEMETRY_WINDOW_SOURCE: ${TELEMETRY_WINDOW_SOURCE:-store}
      TELEMETRY_MAX_SPAN_H: ${TELEMETRY_MAX_SPAN_H:-168}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Read-only: the API only loads artifacts; only the worker / local
      # training (notebooks/train_all.py, scripts/artifact_manifest.py) write
      # models/. A model trained locally is still visible without a rebuild.
      - ./models:/app/models:ro

  mqtt-ingest:
    # Opt-in: `docker compose --profile mqtt up -d mqtt-ingest`. Consumes the broker named by MQTT_BROKER and writes
    # through ingest_samples() (origin `measured`, stream `live`). In production it refuses to start without
    # MQTT_USERNAME / MQTT_PASSWORD (api/startup_checks.py, rule R12). No broker is bundled: point MQTT_BROKER at yours.
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["mqtt"]
    restart: unless-stopped
    command: ["python", "-m", "src.sensor_ingestion"]
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      MQTT_BROKER: ${MQTT_BROKER:?MQTT_BROKER must be set to use the mqtt profile}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_TOPIC: ${MQTT_TOPIC:-digital_twin/sensors}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_TLS: ${MQTT_TLS:-false}
      MQTT_QUEUE_MAX: ${MQTT_QUEUE_MAX:-10000}
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (in .env or the shell)}@db:5432/digital_twin
      TELEMETRY_STORE_ENABLED: ${TELEMETRY_STORE_ENABLED:-true}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
