# Demo overlay (Task 5). Use it WITH docker-compose.yml; never on its own and never for a real deployment:
#   docker compose --env-file .env.demo -f docker-compose.yml -f docker-compose.demo.yml up -d --wait db redis backend
#   docker compose --env-file .env.demo -f docker-compose.yml -f docker-compose.demo.yml run --rm demo-seed
# scripts/demo.ps1 and scripts/demo.sh do exactly this. docker-compose.yml is not modified.
#
# What differs from the base file:
#   * backend runs with ENVIRONMENT=development (the base default, production, refuses to start without a
#     METRICS_TOKEN and explicit CORS origins) and DEMO_MODE=true.
#   * demo-seed is a one-shot service (profile "demo-seed") that runs scripts/demo_seed.py against the same database.
# It contains no credentials: every secret comes from .env.demo, which scripts/demo.* generate (git-ignored by `.env.*`).
services:
  backend:
    environment:
      ENVIRONMENT: development
      DEMO_MODE: "true"

  demo-seed:
    profiles: ["demo-seed"]
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    command: ["python", "scripts/demo_seed.py"]
    environment:
      ENVIRONMENT: development
      DEMO_MODE: "true"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set (scripts/demo.* write it to .env.demo)}
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (scripts/demo.* write it to .env.demo)}@db:5432/digital_twin
    depends_on:
      db:
        condition: service_healthy
