# Route x role authorization matrix, core routes (QA-001, Task 3).
# Format and status classes: see the docstring of tests/authz_matrix.py. Other tasks add their own T<n>.yaml fragment.
# Guards were read from the source (api/auth.py, api/plugins/*.py, api/routes/*.py); the HTTP test in
# tests/test_authz_matrix.py is what proves each cell.

routes:

  # --- Public: no credentials needed (the handler may still refuse a bad body or key)
  - {method: POST, path_template: "/auth/register", anonymous: public, viewer: public, operator: public, admin: public}
  - {method: POST, path_template: "/auth/login", anonymous: public, viewer: public, operator: public, admin: public}
  - {method: POST, path_template: "/auth/refresh", anonymous: public, viewer: public, operator: public, admin: public}
  - {method: POST, path_template: "/auth/logout", anonymous: public, viewer: public, operator: public, admin: public}
