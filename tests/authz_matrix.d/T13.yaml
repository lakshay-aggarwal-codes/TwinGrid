# Task 13 matrix fragment (format: Task 3, tests/authz_matrix.d/*.yaml).
# Only the route Task 13 adds is declared here. The harness (tests/authz_matrix.py) requires all four role cells and
# rejects a `demo` cell until it has a demo-token fixture (test_the_demo_column_is_not_declared_before_the_harness_can_test_it);
# the demo-token behaviour is enforced instead by tests/api/test_demo_session.py for every write route in app.openapi().
routes:
  # Public by design: obtains a read-only demo token, no credential. Answers 404 when DEMO_PUBLIC_ENABLED is off; the matrix runs with it on.
  - {method: POST, path_template: /auth/demo-session, anonymous: public, viewer: public, operator: public, admin: public}
