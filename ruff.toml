target-version = "py312"  # matches runtime.txt exactly
line-length = 120
src = ["."]

[lint]
select = ["E", "F", "I"]  # pyflakes + pycodestyle errors + import sorting
ignore = [
    "E501",  # line length handled by formatter/reviewer judgement, not a hard CI failure yet
]

exclude = [
    "realData",
    "twin-stream-insight-main",
    "vo",
    "bolt-main",
    ".venv",
]

[lint.isort]
# ./alembic is a directory in this repo, which would make ruff classify the
# third-party `alembic` package as first-party. Pin the classification.
known-third-party = ["alembic"]
known-first-party = ["api", "database", "db_url", "models", "notebooks", "scripts", "src", "tests"]
